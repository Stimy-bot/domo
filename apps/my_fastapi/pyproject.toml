[project]
name = "domo-my_fastapi"
version = "0.1.0"
description = "FastAPI example with MongoDB, typed parameters, middleware, and JWT authentication."
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.2.0",
  "fastapi[standard]>=0.115.0",
  "PyJWT>=2.8.0",
  "pydantic-settings>=2.6.0",
  "pymongo>=4.9.0",
  "pwdlib[argon2]>=0.2.1",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
