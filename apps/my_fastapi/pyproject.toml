[project]
name = "my-fastapi"
version = "0.1.0"
description = "FastAPI example with Sql, typed parameters, middleware, and JWT authentication."
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "dotenv>=0.9.9",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.142.4",
    "greenlet>=3.5.6",
    "jinja2>=3.1.6",
    "pillow>=11.0.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.7.1",
    "pyjwt[crypto]>=2.10.1",
    "python-multipart>=0.0.20",
    "resend>=2.49.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Set max line length
line-length = 100
target-version = "py311"

# Exclude virtual environments, build artifacts, and VCS directories
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "dist",
  "build",
]

[tool.ruff.lint]
# Rule Selectors:
# E/W   = pycodestyle (errors / warnings)
# F     = Pyflakes (undefined names, unused imports)
# I     = isort (automated import sorting)
# UP    = pyupgrade (modernize Python 3.11+ syntax automatically)
# B     = flake8-bugbear (common bug patterns)
# ASYNC = flake8-async (async/await best practices for FastAPI)
# SIM   = flake8-simplify (simplifies nested logic/control flows)
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "ASYNC",
  "SIM",
]

# Ignore rules that conflict with FastAPI/Pydantic patterns
ignore = [
  "B008", # Do not perform function calls in argument defaults (essential for FastAPI Depends(), Query(), etc.)
]

# Treat unused variables prefixed with an underscore as intentional
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
