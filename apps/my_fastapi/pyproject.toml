[project]
name = "domo-my_fastapi"
version = "0.1.0"
description = "FastAPI example with MongoDB, typed parameters, middleware, and JWT authentication."
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.2.0",
  "fastapi[standard]>=0.115.0",
  "PyJWT>=2.8.0",
  "pydantic-settings>=2.6.0",
  "pymongo>=4.9.0",
  "pwdlib[argon2]>=0.2.1",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Set max line length
line-length = 100
target-version = "py311"

# Exclude virtual environments, build artifacts, and VCS directories
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "dist",
  "build",
]

[tool.ruff.lint]
# Rule Selectors:
# E/W   = pycodestyle (errors / warnings)
# F     = Pyflakes (undefined names, unused imports)
# I     = isort (automated import sorting)
# UP    = pyupgrade (modernize Python 3.11+ syntax automatically)
# B     = flake8-bugbear (common bug patterns)
# ASYNC = flake8-async (async/await best practices for FastAPI)
# SIM   = flake8-simplify (simplifies nested logic/control flows)
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "ASYNC",
  "SIM",
]

# Ignore rules that conflict with FastAPI/Pydantic patterns
ignore = [
  "B008", # Do not perform function calls in argument defaults (essential for FastAPI Depends(), Query(), etc.)
]

# Treat unused variables prefixed with an underscore as intentional
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"